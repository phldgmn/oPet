# Copy this file to secret.yaml (git-ignored) and fill in real values, or
# manage it out-of-band with SOPS/SealedSecrets/External Secrets and commit
# the encrypted/sealed form under the name secret.yaml instead.
#
#   cp secret.example.yaml secret.yaml
#
# DATABASE_URL must point at the in-cluster `postgres` Service (or an
# external managed Postgres instance) and match postgres-secret.yaml's
# credentials when using the bundled StatefulSet. In-cluster traffic is not
# TLS-terminated, so sslmode=disable is used, mirroring docker-compose-postgres.yml.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: opet
type: Opaque
stringData:
  DATABASE_URL: "postgresql://opet:change-me-db-password@postgres:5432/opet?sslmode=disable"
  JWT_SECRET: "change-me-jwt-secret-min-32-chars"
  SMTP_HOST: "smtp.example.com"
  SMTP_PORT: "587"
  SMTP_USER: "user@example.com"
  SMTP_PASS: "your-smtp-password"
  FROM_EMAIL: "noreply@example.com"
  ADMIN_EMAIL: "admin@example.com"
  ADMIN_PASSWORD: "changeme-admin-password"
