# Copy this file to postgres-secret.yaml (git-ignored) and fill in real
# values, or manage it out-of-band with SOPS/SealedSecrets and commit the
# encrypted/sealed form under the name postgres-secret.yaml instead.
#
#   cp postgres-secret.example.yaml postgres-secret.yaml
#
# NOTE: the credentials here must match the DATABASE_URL you put in
# secret.yaml (backend-secret) -- see secret.example.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: opet
type: Opaque
stringData:
  POSTGRES_USER: "opet"
  POSTGRES_PASSWORD: "change-me-db-password"
  POSTGRES_DB: "opet"
